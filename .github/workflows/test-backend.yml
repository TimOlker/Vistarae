name: Test Backend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vistarae_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint with ruff
        run: |
          ruff check backend/

      - name: Apply SQL Migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d vistarae_test -f supabase/migrations/20261001_init_postgis.sql
          psql -h localhost -U postgres -d vistarae_test -f supabase/migrations/20261002_create_pois_and_access_points.sql
          psql -h localhost -U postgres -d vistarae_test -f supabase/migrations/20261003_create_lists_and_geocache.sql
          psql -h localhost -U postgres -d vistarae_test -f supabase/migrations/20261004_create_users_and_add_user_id.sql

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vistarae_test
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/vistarae_test
          APP_ENV: testing
        run: |
          cd backend
          pytest -v
