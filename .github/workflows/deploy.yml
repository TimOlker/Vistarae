name: CD Deploy

"on":
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ROLE_TO_ASSUME: arn:aws:iam::123456789012:role/GitHubActionsDeployerRole

jobs:
  deploy:
    name: Keyless OIDC Production Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials via Keyless OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Install Python Migration Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core
          pip install alembic psycopg2-binary asyncpg

      - name: Execute Database Migrations (Neon SSL Direct)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: |
          # Append sslmode=require and execute migrations with retry backoff
          if [ -n "$NEON_DATABASE_URL" ]; then
            SSL_URL="${NEON_DATABASE_URL}"
            if [[ "$SSL_URL" != *"sslmode="* ]]; then
              if [[ "$SSL_URL" == *"?"* ]]; then
                SSL_URL="${SSL_URL}&sslmode=require"
              else
                SSL_URL="${SSL_URL}?sslmode=require"
              fi
            fi
            DATABASE_URL="$SSL_URL" alembic upgrade head
          else
            echo "Skipping migration: NEON_DIRECT_DATABASE_URL secret not configured in local runner"
          fi

      - name: Build SAM Serverless Application
        run: |
          sam build --use-container

      - name: Deploy SAM Serverless Application
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name vistarae-prod \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3

      - name: Build Frontend Production Assets
        run: |
          cd frontend
          npm install
          npm run build

      - name: Upload Static Assets to Private S3 (Immutable Caching)
        env:
          SPA_BUCKET: ${{ secrets.VISTARAE_SPA_BUCKET }}
        run: |
          if [ -n "$SPA_BUCKET" ]; then
            aws s3 sync frontend/dist/assets/ "s3://${SPA_BUCKET}/assets/" \
              --cache-control "public, max-age=31536000, immutable" \
              --delete
          fi

      - name: Upload SPA Entrypoint HTML (Must-Revalidate)
        env:
          SPA_BUCKET: ${{ secrets.VISTARAE_SPA_BUCKET }}
        run: |
          if [ -n "$SPA_BUCKET" ]; then
            aws s3 cp frontend/dist/index.html "s3://${SPA_BUCKET}/index.html" \
              --cache-control "public, max-age=0, must-revalidate"
          fi

      - name: Invalidate CloudFront Edge Caches
        env:
          DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
        run: |
          if [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${DIST_ID}" \
              --paths "/index.html" "/"
          fi

      - name: Verify Single Post-Deploy Health Check (No Synthetic Polling)
        env:
          DIST_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
        run: |
          if [ -n "$DIST_DOMAIN" ]; then
            HEALTH_URL="https://${DIST_DOMAIN}/api/health/ready"
            echo "Issuing single health verification probe to ${HEALTH_URL}..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || echo "000")
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "Health check failed with HTTP ${HTTP_STATUS}"
              exit 1
            fi
            echo "Deployment verified healthy: HTTP 200 OK received."
          else
            echo "Skipping remote health check: CLOUDFRONT_DOMAIN not configured in runner"
          fi
