services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    image: vistarae-db:16-3.4
    container_name: vistarae-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vistarae}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vistarae"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vistarae-net

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: vistarae-elasticmq
    restart: unless-stopped
    ports:
      - "9324:9324" # SQS
      - "9325:9325" # UI / Stats
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf
    networks:
      - vistarae-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: vistarae-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - vistarae-net

volumes:
  postgis_data:

networks:
  vistarae-net:
    driver: bridge
