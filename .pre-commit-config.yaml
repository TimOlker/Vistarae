repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, markdown, json]

  - repo: local
    hooks:
      - id: check-copyright-header
        name: Check Copyright Header Banner
        entry: python scripts/check_copyright_headers.py
        language: system
        files: \.(py|ts|tsx|sql)$
