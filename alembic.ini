# Alembic root configuration — points migration scripts to db/migrations/
# and reads DATABASE_URL from the environment at runtime.

[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os

# URL is overridden in env.py from the DATABASE_URL environment variable.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5433/vistarae

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
