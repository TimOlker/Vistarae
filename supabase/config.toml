# Supabase local development configuration for Vistarae
[project]
id = "vistarae"
name = "Vistarae"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 6543
pool_mode = "transaction"

[experimental]
postgis = true
