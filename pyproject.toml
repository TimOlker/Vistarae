[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vistarae-workspace"
version = "0.1.0"
description = "Vistarae Platform Root Workspace"
requires-python = ">=3.12"
dependencies = [
    "vistarae-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.0",
    "alembic>=1.13.0",
    "boto3>=1.34.0",
    "mangum>=0.17.0",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-exporter-otlp>=1.26.0",
    "google-genai>=0.1.1",
    "openlocationcode>=1.0.1",
    "pillow>=10.0.0",
    "defusedxml>=0.7.1",
    "beautifulsoup4>=4.12.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.12",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.7.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.7.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "packages/core"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=packages/core --cov=services --cov-fail-under=90 --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "extractor_scripts",
    "photo_scraper",
    "backend",
    "specs",
    ".specify",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]
ignore = ["B008", "E501", "UP042", "UP038"]
mccabe = { max-complexity = 15 }

[tool.coverage.run]
source = ["packages/core", "services"]
omit = ["tests/*", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
vistarae-core = { workspace = true }
