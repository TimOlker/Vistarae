<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vistarae — POI Explorer & Database Browser</title>
    <link rel="stylesheet" href="browser.css" />
    <link rel="icon" type="image/png" href="../icons/icon16.png" />
  </head>
  <body>
    <div class="vistarae-app">
      <!-- Top Navigation Bar -->
      <header class="navbar">
        <div class="brand">
          <img
            src="../icons/icon48.png"
            alt="Vistarae Logo"
            class="brand-icon"
          />
          <span class="brand-title">Vistarae</span>
          <span class="brand-subtitle">Catalog Workstation</span>
        </div>

        <div class="nav-actions">
          <button
            id="btn-export-csv"
            class="btn btn-secondary"
            title="Export all or filtered POIs to CSV"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2 2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Export to CSV
          </button>

          <button
            id="btn-refresh"
            class="btn btn-primary"
            title="Refresh POI catalog"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Refresh
          </button>
        </div>
      </header>

      <!-- Filter & Search Toolbar -->
      <section class="toolbar">
        <div class="search-box">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="search-icon"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="input-search"
            placeholder="Search by name, city, country, or tag..."
            autofocus
          />
        </div>

        <div class="filter-controls">
          <select id="select-category" class="filter-select">
            <option value="ALL">All Categories</option>
            <option value="viewpoint">Scenic Viewpoints</option>
            <option value="trail">Trails & Hikes</option>
            <option value="landmark">Historic Landmarks</option>
            <option value="campground">Campgrounds</option>
            <option value="dining">Dining & Food</option>
            <option value="experience">Experiences</option>
          </select>

          <select id="select-sort" class="filter-select">
            <option value="name_asc">Name (A-Z)</option>
            <option value="name_desc">Name (Z-A)</option>
            <option value="rating_desc">Highest Rated</option>
            <option value="distance_asc">Proximity (Closest First)</option>
          </select>

          <button
            id="btn-proximity"
            class="btn btn-chip"
            title="Calculate distance from your current location"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="12 8 8 12 12 16 16 12 12 8"></polygon>
            </svg>
            <span id="proximity-status">Enable Proximity</span>
          </button>
        </div>
      </section>

      <!-- Table Container -->
      <main class="content-area">
        <div class="table-card">
          <div class="table-header-meta">
            <span id="record-count" class="badge-count">Loading POIs...</span>
            <div id="bulk-actions" class="bulk-actions hidden">
              <span id="selected-count">0 selected</span>
              <button id="btn-bulk-delete" class="btn btn-danger btn-sm">
                Delete Selected
              </button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="data-table" id="poi-table">
              <thead>
                <tr>
                  <th width="40">
                    <input
                      type="checkbox"
                      id="th-check-all"
                      title="Select all"
                    />
                  </th>
                  <th>Destination</th>
                  <th>Category</th>
                  <th>Location</th>
                  <th>Rating</th>
                  <th>Local Photos</th>
                  <th width="120">Actions</th>
                </tr>
              </thead>
              <tbody id="poi-tbody">
                <!-- Dynamically populated by browser.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>

      <!-- Status Toast Banner -->
      <div id="toast-banner" class="toast hidden"></div>
    </div>

    <script type="module" src="browser.js"></script>
  </body>
</html>
