[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vistarae-core"
version = "0.1.0"
description = "Vistarae Core Domain, Ports, Adapters and Schemas"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "starlette>=0.38.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.0",
    "pgvector>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vistarae_core*"]
